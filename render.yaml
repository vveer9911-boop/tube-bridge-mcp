services:
  - type: web
    name: tube-bridge-mcp
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python server.py"
    envVars:
      - key: PORT
        value: "8080"
      - key: OMNIROUTE_ENDPOINT
        value: "http://omniroute:20128/v1/chat/completions" # Internal Render DNS
  
  - type: web
    name: omniroute
    env: image
    image:
      url: diegosouzapw/omniroute:latest
    envVars:
      - key: PORT
        value: "20128"
